<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Estruc-TI: análisis estructural 2D para TI-Nspire CX II CAS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="0.6" stop-color="#14336f"/>
      <stop offset="1" stop-color="#1d4f9c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="mpos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fb3ff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="mneg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect y="392" width="1280" height="8" fill="#3d8bfd"/>

  <!-- Texto -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="168" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">Estruc<tspan fill="#5fb3ff">-TI</tspan></text>
    <text x="76" y="218" font-size="28" fill="#dbe7ff">Análisis de marcos, vigas y armaduras planas</text>
    <text x="76" y="254" font-size="28" fill="#dbe7ff">por el método directo de rigidez</text>
    <g font-size="18" font-weight="600">
      <rect x="76" y="290" width="236" height="36" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="194" y="314" text-anchor="middle" fill="#ffffff">TI-Nspire CX II CAS</text>
      <rect x="324" y="290" width="92" height="36" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="370" y="314" text-anchor="middle" fill="#ffffff">Lua</text>
      <rect x="428" y="290" width="150" height="36" rx="18" fill="#3d8bfd" fill-opacity="0.9"/>
      <text x="503" y="314" text-anchor="middle" fill="#ffffff">N · V · M · θ · δ</text>
    </g>
  </g>

  <!-- Marco con diagrama de momento -->
  <g transform="translate(780,70)" stroke-linecap="round" stroke-linejoin="round">
    <!-- diagrama M (viga) -->
    <path d="M40 90 Q190 -40 340 90 Z" fill="url(#mpos)"/>
    <path d="M40 90 Q190 -40 340 90" fill="none" stroke="#5fb3ff" stroke-width="3"/>
    <!-- diagrama M (columna derecha) -->
    <path d="M340 90 L392 90 L340 270 Z" fill="url(#mneg)"/>
    <path d="M392 90 L340 270" fill="none" stroke="#ff8a8a" stroke-width="3"/>
    <!-- deformada -->
    <path d="M40 270 C44 200 52 130 62 96 C150 110 240 112 360 98 C364 160 352 220 340 270" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="8 7"/>
    <!-- barras -->
    <path d="M40 270 V90 H340 V270" fill="none" stroke="#ffffff" stroke-width="7"/>
    <!-- nudos -->
    <g fill="#0b1f4d" stroke="#ffffff" stroke-width="3">
      <circle cx="40" cy="90" r="7"/><circle cx="340" cy="90" r="7"/>
    </g>
    <!-- carga distribuida -->
    <g stroke="#ffd166" stroke-width="2.5" fill="#ffd166">
      <line x1="40" y1="20" x2="340" y2="20"/>
      <g>
        <line x1="70" y1="20" x2="70" y2="68"/><path d="M63 62 L70 76 L77 62 Z" stroke="none"/>
        <line x1="130" y1="20" x2="130" y2="68"/><path d="M123 62 L130 76 L137 62 Z" stroke="none"/>
        <line x1="190" y1="20" x2="190" y2="68"/><path d="M183 62 L190 76 L197 62 Z" stroke="none"/>
        <line x1="250" y1="20" x2="250" y2="68"/><path d="M243 62 L250 76 L257 62 Z" stroke="none"/>
        <line x1="310" y1="20" x2="310" y2="68"/><path d="M303 62 L310 76 L317 62 Z" stroke="none"/>
      </g>
    </g>
    <!-- carga lateral -->
    <g stroke="#ffd166" stroke-width="3" fill="#ffd166">
      <line x1="-40" y1="90" x2="22" y2="90"/><path d="M16 82 L32 90 L16 98 Z" stroke="none"/>
    </g>
    <!-- empotramientos -->
    <g stroke="#7ee2a8" stroke-width="3">
      <line x1="14" y1="272" x2="66" y2="272"/>
      <line x1="20" y1="272" x2="10" y2="286"/><line x1="32" y1="272" x2="22" y2="286"/><line x1="44" y1="272" x2="34" y2="286"/><line x1="56" y1="272" x2="46" y2="286"/><line x1="66" y1="272" x2="56" y2="286"/>
      <line x1="314" y1="272" x2="366" y2="272"/>
      <line x1="320" y1="272" x2="310" y2="286"/><line x1="332" y1="272" x2="322" y2="286"/><line x1="344" y1="272" x2="334" y2="286"/><line x1="356" y1="272" x2="346" y2="286"/><line x1="366" y1="272" x2="356" y2="286"/>
    </g>
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700">
      <text x="190" y="12" text-anchor="middle" fill="#ffd166">w = 15 kN/m</text>
      <text x="-40" y="80" fill="#ffd166">20 kN</text>
      <text x="190" y="128" text-anchor="middle" fill="#5fb3ff">M⁺ 34.76</text>
      <text x="398" y="86" fill="#ff8a8a">−49.67</text>
    </g>
  </g>
</svg>
