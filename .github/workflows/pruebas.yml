name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Pruebas del motor y comparación independiente
        run: |
          python tests/run_tests.py | tee salida.txt
          grep -q "FALLAS: 0" salida.txt
          grep -q "Comparacion independiente del marco: OK" salida.txt
